name: validate

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to attach skill zips to a release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Marketplace and plugin manifests, skills
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict plugins/immport
      - name: Build skill zips
        run: python3 scripts/build_skill_zips.py
      - name: Attach zips to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
